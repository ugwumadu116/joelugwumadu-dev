server {
  # 8080 rather than 80 so the container needs no privileged port.
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /thanks, not /thanks.html — the payment rail's return_url should not carry
  # an implementation detail the buyer can see.
  location = /thanks {
    try_files /thanks.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # A payment confirmation must never be served from cache.
  location = /thanks.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
}
